---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: criticalapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: container1
          image: nginx
          ports:
            - containerPort: 3306
