---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-role
  namespace: dev
rules:
  - apiGroups: ["*"]
    resources: ["pods", "deployments"]
    verbs: ["get", "list","create"]

  - apiGroups: ["*"]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devrole-bind
  namespace: dev
subjects:
  - kind: User
    name: santosh
    apiGroup: rbac.authorization.k8s.io

roleRef:
   kind: Role
   name: dev-role
   apiGroup: rbac.authorization.k8s.io
